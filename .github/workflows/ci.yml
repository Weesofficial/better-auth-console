name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        # See better-auth-shield's CI: without this axis the include entries
        # below would replace the plain Node 24 job instead of joining it.
        deps: [lockfile]
        include:
          - node: 24
            deps: latest
          - node: 24
            deps: 1.7.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.deps != 'lockfile'
        run: npm install --no-audit --no-fund --legacy-peer-deps better-auth@${{ matrix.deps }}
      - run: npm run typecheck
      # Builds the UI first (pretest); Node 20 runs only the memory adapter.
      - run: npm test
      - run: npm run build
